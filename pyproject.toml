[build-system]
# PEP 639（SPDX 协议表达式 + license-files）自 setuptools 77 起支持，
# 构建隔离环境会自行拉取，因此这里声明的是构建期下限而非运行期依赖。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ohauto"
# ★ 版本号的**唯一源**就是这一行。ohauto/__init__.py 通过 importlib.metadata
#   读取它（源码直用时回退解析本文件），不在代码里另写字面量。
version = "0.3.0"
description = "面向 OpenHarmony 的多模态智能 UI 测试系统 —— 基于 hdc 命令行通路，设备侧零部署"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["openharmony", "harmonyos", "ui-automation", "testing", "hdc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
]

# 命令行入口：安装后可直接 `ohauto-doctor` 跑环境自检（源码直用则 python -m ohauto.doctor）
[project.scripts]
ohauto-doctor = "ohauto.doctor:main"

[tool.setuptools]
packages = ["ohauto", "ohauto.static_arkts"]

[tool.setuptools.package-data]
# 形态档案（77 条设备形态数据）与静态分析器是运行时依赖，必须随包分发
ohauto = ["devices/*.json", "devices/*.md"]
"ohauto.static_arkts" = ["*.mjs"]
